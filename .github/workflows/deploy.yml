name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: ["live"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` strictly follows the lockfile. Our `package-lock.json` was created
      # on macOS and doesn't include Linux-specific optional binaries
      # (e.g. `@parcel/watcher-linux-x64-glibc`), which are required on ubuntu-latest.
      # `npm install` will resolve/install the correct optional dependency for the runner OS.
      - name: Install deps (including optional binaries for Linux)
        run: |
          echo "npm version: $(npm -v)"
          echo "npm config omit: $(npm config get omit || true)"
          NPM_CONFIG_OMIT= npm install --include=optional --no-audit --no-fund
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
